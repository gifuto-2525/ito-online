<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ito ONLINE — Night Lounge Edition</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header class="brand-header">
      <h1 class="brand-title">ito ONLINE</h1>
      <div class="brand-sub">Night Lounge Table</div>
    </header>

    <!-- ロビー画面 -->
    <div id="lobbyScreen" class="panel">
      <div class="panel-title">TABLE CHECK-IN（入室設定）</div>
      <div class="field">
        <label class="block" for="playerName">プレイヤー名</label>
        <input id="playerName" type="text" placeholder="例：タロウ" maxlength="20" />
      </div>
      <div class="field">
        <label class="block">参加スタイル</label>
        <div class="role-selector">
          <label class="role-option"><input type="radio" name="role" value="host" checked /> ホスト（卓を作る）</label>
          <label class="role-option"><input type="radio" name="role" value="member" /> メンバー（卓に入る）</label>
        </div>
      </div>
      <div class="field">
        <label class="block" for="roomName">ルーム名</label>
        <input id="roomName" type="text" placeholder="例：ラウンジ1号卓" maxlength="30" />
      </div>
      <div class="field">
        <label class="block" for="roomPassword">合言葉（パスワード）</label>
        <input id="roomPassword" type="password" placeholder="合言葉を入力" maxlength="30" />
      </div>
      <button id="enterBtn" class="primary" type="button" style="width: 100%; padding: 0.75rem;">テーブルに着席する</button>
      <div id="lobbyError" style="color: #fb7185; margin-top: 0.6rem; font-size: 0.9rem;"></div>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameScreen" style="display: none;">
      <div class="panel">
        <div class="session-bar">
          <div id="headerInfo"></div>
          <button id="leaveBtn" type="button">退席する</button>
        </div>
        <div id="memberList" class="member-chips"></div>
      </div>

      <!-- ホスト専用コントロール -->
      <div id="hostPanel" class="panel" style="display: none;">
        <div class="panel-title">HOST CONTROL（お題・ゲーム進行）</div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <input id="themeInput" type="text" placeholder="自由にお題を入力（空欄でランダム選出）" style="flex: 1; min-width: 220px;" />
          <button id="fillRandomThemeBtn" type="button">お題を引く</button>
          <button id="startRoundBtn" class="primary" type="button">カードを配る（開始）</button>
        </div>
      </div>

      <!-- お題 -->
      <div class="panel theme-stage">
        <div class="theme-caption">CURRENT THEME</div>
        <div id="themeDisplay" class="theme-text">ホストの開始をお待ちください</div>
      </div>

      <!-- 自分の手札・回答入力 -->
      <div class="panel">
        <div class="panel-title">YOUR HAND（あなたの手札・たとえ表現）</div>
        <div id="myCardArea" style="color: var(--text-muted);">ラウンド開始をお待ちください。</div>
      </div>

      <!-- 場のカード -->
      <div class="panel">
        <div class="panel-title">TABLE CARDS（大きい順に並び替え）</div>
        <div class="order-guide">
          <span>▲ 上にあるほど「大きい（100に近い）」</span>
          <span>▼ 下にあるほど「小さい（1に近い）」</span>
        </div>
        <div id="playedArea"></div>
        <div style="margin-top: 0.9rem;">
          <button id="revealBtn" class="reveal-btn" type="button">✦ カードを一斉オープン（結果判定）</button>
        </div>
      </div>

      <!-- ログ -->
      <div class="panel">
        <div class="panel-title">TABLE LOG（進行履歴）</div>
        <div id="logArea" class="log-box"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase,
      ref,
      get,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // ★ 自分のFirebaseプロジェクトの設定に書き換えてください
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCB77-714bKM6X8Ig2DL1KSHPMDhwGofaE",
      authDomain: "ito-on-line.firebaseapp.com",
      databaseURL: "https://ito-on-line-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ito-on-line",
      storageBucket: "ito-on-line.firebasestorage.app",
      messagingSenderId: "404687366039",
      appId: "1:404687366039:web:30d90976d82498f46406d2",
      measurementId: "G-1E8HQEZX9Q"
    };

    const THEMES = [
      "大きそうなもの", "重そうなもの", "強そうな武器・アイテム", "硬そうなもの",
      "速そうなもの・乗り物", "長生きしそうな生き物", "強いと思う動物", "最強だと思うアニメ・ゲームキャラ",
      "人気のアニメ・ゲームキャラ", "高価そうなもの・高級品", "人気のコンビニ商品", "好きな給食・学食のメニュー",
      "定番の旅行先", "もらって嬉しいプレゼント", "人気がありそうな職業", "有名な歴史上の人物",
      "無人島に持っていきたいもの", "言いづらい一言", "休日にやりがちなこと", "朝起きて最初にしたいこと",
      "テンションが上がること", "寝る前にやりがちなこと", "夏にやりたくなること", "冬にやりたくなること",
      "学校や職場で怒られそうなこと", "遅刻したときの言い訳", "怖いもの・ホラー要素", "美味しそうな食べ物",
      "酸っぱそうなもの", "辛そうなもの", "甘そうなもの", "臭そうなもの",
      "かっこいいセリフ・決め台詞", "かわいいと思う生き物・キャラ", "大人っぽいなと思う行動", "子供っぽいなと思う行動",
      "カバンに入っていると安心するもの", "冷蔵庫に入っていそうなもの", "100均で買える便利なもの", "スマホに入れておきたいアプリ",
      "カラオケで盛り上がる曲のジャンル・特徴", "学生時代に流行ったもの", "人生で一度はやってみたいこと",
      "タイムマシンで行ってみたい時代・場所", "超能力が1つ使えるなら欲しい能力", "宝くじで1億円当たったらやりたいこと"
    ];

    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);

    let playerId = localStorage.getItem("ito_player_id");
    if (!playerId) {
      playerId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
      localStorage.setItem("ito_player_id", playerId);
    }

    const session = {
      playerName: "",
      role: "host",
      roomName: "",
      password: "",
      roomKey: "",
      unsubscribe: null
    };

    // 1〜100の数値に応じたナイトラウンジ発光カラー
    function getCardThemeStyle(num) {
      if (typeof num !== "number") {
        return `--card-accent: #94a3b8; --card-glow: rgba(148, 163, 184, 0.2);`;
      }
      if (num <= 25) {
        return `--card-accent: #38bdf8; --card-glow: rgba(56, 189, 248, 0.35);`; // クールブルー
      }
      if (num <= 50) {
        return `--card-accent: #34d399; --card-glow: rgba(52, 211, 153, 0.35);`; // エメラルド
      }
      if (num <= 75) {
        return `--card-accent: #fbbf24; --card-glow: rgba(251, 191, 36, 0.4);`;  // アンバーゴールド
      }
      return `--card-accent: #fb7185; --card-glow: rgba(251, 113, 133, 0.45);`;   // ルビーレッド
    }

    async function hashPassword(pw) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function toRoomKey(roomName) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(roomName));
      return "room_" + Array.from(new Uint8Array(buf)).slice(0, 12).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function nowTime() {
      return new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function appendLog(room, msg) {
      const logs = Array.isArray(room.logs) ? room.logs : [];
      logs.unshift(`[${nowTime()}] ${msg}`);
      room.logs = logs.slice(0, 50);
    }

    document.getElementById("enterBtn").addEventListener("click", async () => {
      const name = document.getElementById("playerName").value.trim();
      const role = document.querySelector('input[name="role"]:checked').value;
      const roomName = document.getElementById("roomName").value.trim();
      const password = document.getElementById("roomPassword").value;
      const errEl = document.getElementById("lobbyError");

      if (!name || !roomName || !password) {
        errEl.textContent = "プレイヤー名・ルーム名・合言葉をすべて入力してください。";
        return;
      }

      const pwHash = await hashPassword(password);
      const roomKey = await toRoomKey(roomName);
      const roomRef = ref(db, `rooms/${roomKey}`);

      try {
        if (role === "host") {
          const snap = await get(roomRef);
          if (snap.exists() && snap.val().passwordHash && snap.val().passwordHash !== pwHash) {
            errEl.textContent = "同名のルームが既に存在します（合言葉が一致しません）。";
            return;
          }

          const initialRoom = {
            roomName,
            passwordHash: pwHash,
            hostId: playerId,
            theme: "",
            started: false,
            revealed: false,
            players: [
              { id: playerId, name, number: null, answerText: "", played: false }
            ],
            playedOrder: [],
            logs: [`[${nowTime()}] ルーム「${roomName}」を開設しました（ホスト: ${name}）`]
          };

          await runTransaction(roomRef, (current) => {
            if (current && current.passwordHash && current.passwordHash !== pwHash) {
              return current;
            }
            return initialRoom;
          });
        } else {
          const snap = await get(roomRef);
          if (!snap.exists()) {
            errEl.textContent = "指定されたルームが見つかりません。";
            return;
          }
          const existing = snap.val();
          if (existing.passwordHash !== pwHash) {
            errEl.textContent = "合言葉が違います。";
            return;
          }

          let joinBlocked = false;
          await runTransaction(roomRef, (current) => {
            if (!current) return current;
            const players = Array.isArray(current.players) ? current.players : [];
            const found = players.find(p => p.id === playerId);
            if (found) {
              found.name = name;
            } else {
              if (current.started && !current.revealed) {
                joinBlocked = true;
                return current;
              }
              players.push({ id: playerId, name, number: null, answerText: "", played: false });
              appendLog(current, `${name} が着席しました`);
            }
            current.players = players;
            return current;
          });

          if (joinBlocked) {
            errEl.textContent = "現在ゲーム進行中のため途中参加できません。";
            return;
          }
        }

        session.playerName = name;
        session.role = role;
        session.roomName = roomName;
        session.password = password;
        session.roomKey = roomKey;

        errEl.textContent = "";
        document.getElementById("lobbyScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";

        if (session.unsubscribe) session.unsubscribe();
        session.unsubscribe = onValue(roomRef, (snapshot) => {
          if (!snapshot.exists()) return;
          renderState(snapshot.val());
        });
      } catch (e) {
        errEl.textContent = "通信エラーが発生しました: " + e.message;
      }
    });

    document.getElementById("leaveBtn").addEventListener("click", () => {
      if (session.unsubscribe) {
        session.unsubscribe();
        session.unsubscribe = null;
      }
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("lobbyScreen").style.display = "block";
    });

    document.getElementById("fillRandomThemeBtn").addEventListener("click", () => {
      document.getElementById("themeInput").value = THEMES[Math.floor(Math.random() * THEMES.length)];
    });

    document.getElementById("startRoundBtn").addEventListener("click", async () => {
      const rawTheme = document.getElementById("themeInput").value.trim();
      const roomRef = ref(db, `rooms/${session.roomKey}`);

      await runTransaction(roomRef, (room) => {
        if (!room || room.hostId !== playerId) return room;
        const players = Array.isArray(room.players) ? room.players : [];
        const theme = rawTheme || THEMES[Math.floor(Math.random() * THEMES.length)];

        const pool = Array.from({ length: 100 }, (_, i) => i + 1);
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        room.players = players.map((p, idx) => ({
          ...p,
          number: pool[idx],
          answerText: "",
          played: false
        }));
        room.theme = theme;
        room.started = true;
        room.revealed = false;
        room.playedOrder = [];
        appendLog(room, `新ラウンド開始（${room.players.length}人・大きい順）お題：「${theme}」`);
        return room;
      });
    });

    document.getElementById("revealBtn").addEventListener("click", async () => {
      const roomRef = ref(db, `rooms/${session.roomKey}`);

      await runTransaction(roomRef, (room) => {
        if (!room || !room.started || room.revealed) return room;
        const order = Array.isArray(room.playedOrder) ? room.playedOrder : [];
        if (order.length === 0) return room;

        room.revealed = true;
        let isSuccess = true;
        for (let i = 1; i < order.length; i++) {
          if (order[i - 1].number < order[i].number) {
            isSuccess = false;
            break;
          }
        }
        const summary = order.map((c, i) => `${i + 1}位:${c.playerName}[${c.number}](${c.answerText})`).join(" → ");
        const label = isSuccess ? "成功！美しいグラデーション順に並びました" : "失敗…小さい数字が先に来ています";
        appendLog(room, `オープン判定: ${label} / ${summary}`);
        return room;
      });
    });

    function renderState(room) {
      const players = Array.isArray(room.players) ? room.players : [];
      const playedOrder = Array.isArray(room.playedOrder) ? room.playedOrder : [];
      const logs = Array.isArray(room.logs) ? room.logs : [];
      const isHost = room.hostId === playerId;

      document.getElementById("hostPanel").style.display = isHost ? "block" : "none";
      document.getElementById("headerInfo").innerHTML =
        `ROOM: <strong style="color: var(--gold-light);">${escapeHtml(room.roomName)}</strong> ／ PLAYER: <strong>${escapeHtml(session.playerName)}</strong>`;

      const memberList = document.getElementById("memberList");
      memberList.innerHTML = players.map(p => {
        const hostMark = p.id === room.hostId ? " ★HOST" : "";
        return `<span class="member-chip ${p.id === room.hostId ? "host" : ""}">${escapeHtml(p.name)}${hostMark}</span>`;
      }).join("");

      document.getElementById("themeDisplay").textContent = room.theme || "ホストの開始をお待ちください";

      // 自分の手札カード
      const me = players.find(p => p.id === playerId);
      const myCardArea = document.getElementById("myCardArea");
      if (!room.started || !me || me.number === null || me.number === undefined) {
        myCardArea.textContent = "ラウンド開始をお待ちください。";
      } else {
        const existingInput = document.getElementById("myAnswerInput");
        const isTyping = existingInput && document.activeElement === existingInput;
        if (!isTyping) {
          const cardStyle = getCardThemeStyle(me.number);
          myCardArea.innerHTML = `
            <div class="hand-layout">
              <div class="playing-card" style="${cardStyle}">
                <div class="corner-top">#${me.number}</div>
                <div class="center-num">${me.number}</div>
                <div class="corner-bottom">ito CARD</div>
              </div>
              <div class="hand-form">
                <div style="font-size: 0.85rem; color: #cbd5e1;">
                  数字は口に出さず、お題に沿った「たとえ」を入力してください（公開前なら修正可）。
                </div>
                <div class="hand-form-row">
                  <input id="myAnswerInput" type="text" placeholder="例：東京タワー、コンビニのおにぎり..."
                    value="${escapeHtml(me.answerText || "")}" ${room.revealed ? "disabled" : ""} />
                  <button id="submitMyAnswerBtn" class="primary" type="button" ${room.revealed ? "disabled" : ""}>
                    ${me.played ? "表現を更新する" : "テーブルに出す"}
                  </button>
                </div>
              </div>
            </div>
          `;
          document.getElementById("submitMyAnswerBtn").onclick = async () => {
            const raw = document.getElementById("myAnswerInput").value;
            const text = raw.trim() || "（無言の表現）";
            const roomRef = ref(db, `rooms/${session.roomKey}`);

            await runTransaction(roomRef, (cur) => {
              if (!cur || !cur.started || cur.revealed) return cur;
              const pList = Array.isArray(cur.players) ? cur.players : [];
              const target = pList.find(p => p.id === playerId);
              if (!target) return cur;

              let order = Array.isArray(cur.playedOrder) ? cur.playedOrder : [];
              if (!target.played) {
                target.played = true;
                target.answerText = text;
                order.push({
                  playerId: target.id,
                  playerName: target.name,
                  number: target.number,
                  answerText: text
                });
                appendLog(cur, `${target.name} がテーブルにカードを出しました → 「${text}」`);
              } else if (target.answerText !== text) {
                const old = target.answerText;
                target.answerText = text;
                order = order.map(c => c.playerId === playerId ? { ...c, answerText: text } : c);
                appendLog(cur, `${target.name} が表現を修正：「${old}」→「${text}」`);
              }
              cur.players = pList;
              cur.playedOrder = order;
              return cur;
            });
          };
        }
      }

      // 場のカード
      const playedArea = document.getElementById("playedArea");
      playedArea.innerHTML = "";
      playedOrder.forEach((c, idx) => {
        const div = document.createElement("div");
        div.className = "table-card";
        if (room.revealed) {
          div.classList.add("revealed");
          div.setAttribute("style", getCardThemeStyle(c.number));
          const prevOk = idx === 0 || playedOrder[idx - 1].number >= c.number;
          div.classList.add(prevOk ? "ok" : "ng");
        }
        const numLabel = room.revealed ? `#${c.number}` : "SECRET";
        div.innerHTML = `
          <div>
            <span class="rank-badge">${idx + 1}位</span>
            <strong>${escapeHtml(c.playerName)}</strong>：「${escapeHtml(c.answerText)}」
            <span class="num-pill">${numLabel}</span>
          </div>
          <div>
            <button type="button" class="up-btn" ${room.revealed || idx === 0 ? "disabled" : ""}>▲ 上へ</button>
            <button type="button" class="down-btn" ${room.revealed || idx === playedOrder.length - 1 ? "disabled" : ""}>▼ 下へ</button>
          </div>
        `;
        div.querySelector(".up-btn").onclick = () => moveCard(idx, -1);
        div.querySelector(".down-btn").onclick = () => moveCard(idx, 1);
        playedArea.appendChild(div);
      });

      document.getElementById("logArea").innerHTML =
        logs.map(line => `<div class="log-item">${escapeHtml(line)}</div>`).join("");
    }

    async function moveCard(index, direction) {
      const roomRef = ref(db, `rooms/${session.roomKey}`);
      await runTransaction(roomRef, (room) => {
        if (!room || !room.started || room.revealed) return room;
        const order = Array.isArray(room.playedOrder) ? room.playedOrder : [];
        const targetIndex = index + direction;
        if (index < 0 || index >= order.length || targetIndex < 0 || targetIndex >= order.length) return room;

        const a = order[index];
        const b = order[targetIndex];
        order[index] = b;
        order[targetIndex] = a;
        room.playedOrder = order;
        appendLog(room, `並び替え: ${a.playerName}（「${a.answerText}」）と ${b.playerName}（「${b.answerText}」）を入れ替え`);
        return room;
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
